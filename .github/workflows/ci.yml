name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile sources
        run: python -m compileall -q src tests scripts
      - name: Public-tree checks (no data, credentials, personal paths or large files)
        run: python scripts/check_public_tree.py .
      - name: Configuration files parse
        run: python -c "import tomllib,glob; [tomllib.load(open(f,'rb')) for f in glob.glob('configs/*.toml')]"

  tests:
    runs-on: ubuntu-latest
    needs: static
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Synthetic test-suite (no real data required)
        working-directory: tests
        run: python -W ignore -m unittest -v
      - name: Synthetic end-to-end demonstration
        run: cgp synthetic-demo --out "$RUNNER_TEMP/demo"
